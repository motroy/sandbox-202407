# Settings for scripts/02_context_analysis.py
[analysis]
arg_tool = "resfinder"        # resfinder (ResFinder 4, 80% id/cov) | amrfinder
location_tool = "platon"      # platon (+ size rule) | mobrecon
plasmid_size_rule = 500000    # Platon mode: contigs longer than this are chromosomal (the paper's rule)
resfinder_min_identity = 80.0
resfinder_min_coverage = 80.0
gene_regex = "^blaCTX-M-15$"   # gene symbol (regex) to analyse; use "^blaCTX-M" for all variants
window_bp  = 10000             # flank searched on each side of the gene for IS and other AMR genes
min_contig_bp = 100000       # linear contigs shorter than this are flagged short_contig
region_gap_bp = 5000           # max gap when merging blaCTX-M, co-located ARGs and IS into the inserted region
# IS families credited as integration mediators, checked in this order
mediators  = ["ISEcp1", "IS26"]

[input]
samples = "input/samples.tsv"  # sample, fasta, resfinder, platon[, amrfinder, mobrecon_dir, st, gbff, mlst, clermont, ectyper, fimtyper]
outdir  = "results"

[sites]
# 03_insertion_sites.py: K-12 MG1655 GBFF (NC_000913.3) used as the 0-100 min reference
k12_gbff = "input/k12_MG1655.gbff"
n_anchors = 5          # CDS per flank mapped to K-12
max_chain_gap_min = 1.0
min_chain_genes = 2
max_junction_gap_min = 5.0

[selection]
# 00_select_genomes.py. Column names of the NCBI assembly metadata table (e.g. from `datasets summary genome` -> TSV)
taxid_col = "taxid"          # 562 = E. coli
ani_col = "ani_status"       # must equal "OK"
n50_col = "n50"
completeness_col = "completeness"
contamination_col = "contamination"
bioproject_col = "bioproject"
release_date_col = "release_date"
tech_col = "sequencing_tech" # must match long_read_regex
long_read_regex = "(?i)nanopore|ont|pacbio|sequel|minion|promethion|hybrid"
accession_col = "accession"
taxid = "562"
min_n50 = 100000
min_completeness = 90.0
max_contamination = 5.0
resfinder_min_identity = 80.0
resfinder_min_coverage = 80.0
max_cgmlst_dist = 10

[clinker]
# 06_clinker_windows.py
flank_bp = 5000          # flank added on each side of the inserted region (assumption; not stated in the supplied Methods)
location = "chromosome"  # which hits to align: chromosome | plasmid | all
max_per_variant = 12     # genomes per variant, most recurrent barcodes first
