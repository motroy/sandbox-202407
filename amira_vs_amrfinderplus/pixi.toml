[workspace]
name = "amira_vs_amrfinderplus"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

# shared tooling
[dependencies]
python = "3.10.*"
pandas = "*"
curl = "*"

# Amira (reads) -- pins mirror Amira's environment.yaml
[feature.amira.dependencies]
amira = "0.11.0.*"
samtools = "1.18.*"
racon = "1.4.10.*"
minimap2 = "2.17.*"
flye = "2.9.3.*"
jellyfish = "*"

# AMRFinderPlus (assembly) -- kept apart: flye's zlib pin blocks amrfinderplus >=4.2
[feature.amrfinder.dependencies]
ncbi-amrfinderplus = ">=4.2"

[environments]
amira = { features = ["amira"], no-default-feature = false }
amrfinder = { features = ["amrfinder"], no-default-feature = false }
