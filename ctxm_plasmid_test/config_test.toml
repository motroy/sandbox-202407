# Config for plot_ctxm_plasmids_v2.py
# Run:  python plot_ctxm_plasmids_v2.py --config config.toml
# Any command-line option overrides the value here. Relative paths are relative to where you run the script.

mobrecon_dir = "mobrecon_first_run"
amr_dir      = "amrfinder"         # AMRFinderPlus tables, one per sample

outdir       = "ctxm_plasmid_figs_test"

# MOB-suite primary clusters to plot
clusters = ["AA147", "AC315", "AA474", "AA161", "AA176", "AB690", "AA887", "AA738", "AA173", "AA002", "AA057", "AA739"]

mge_file        = "mge.report.txt" # MOB-recon MGE report inside each sample folder
max_per_cluster = 8                # tracks per figure, including the reference
min_identity    = 90.0             # blastn % identity for ribbons and contig placement
min_aln_len     = 300              # minimum alignment length (bp)

# Optional: closed reference plasmid per cluster (otherwise the longest single contig in the cluster is used)
# [refs]
# AA147 = "refs/AA147_reference.fasta"
